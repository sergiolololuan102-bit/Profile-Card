<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">

        <div class="info-box">
            <img src="WhatsApp Image 2026-10-07 at 11.30.19.jpeg" alt="">

            <div class="info">
                <h2>Etar Sergio Lololuan</h2>
                <p>Software Engineer</p>
            </div>
        </div>

        <div class="number-grid">

            <div class="box">
                <p>11</p>
                <p>postingan</p>
            </div>

            <div class="box">
                <p>234</p>
                <p>pengikut</p>
            </div>

            <div class="box">
                <p>244</p>
                <p>mengikuti</p>
            </div>

        </div>

        <div class="btn-box">
            <button class="follow">Follow</button>
            <button class="message">Message</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
